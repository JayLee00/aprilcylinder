[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aprilcylinder"
version = "0.1.0"
description = "3D-printable cylindrical fiducial targets (ArUco marker bands) and axis angle / position tracking, built on aprilcube"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aprilcube>=0.3.1",
    "opencv-contrib-python>=4.8,<5",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
aprilcyl = "aprilcylinder.cli:main"

[project.urls]
Homepage = "https://github.com/JayLee00/aprilcylinder"
"Built on" = "https://github.com/younghyopark/aprilcube"
