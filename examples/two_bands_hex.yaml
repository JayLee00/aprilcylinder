    sides: 6
    across_flats_mm: 40
    height_mm: 23.09
  - type: cylinder
    diameter_mm: 30
    height_mm: 60
  - type: polygon
    sides: 6
    across_flats_mm: 40
    height_mm: 44
    rows: 2
